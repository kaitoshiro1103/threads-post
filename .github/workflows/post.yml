name: threads-post
on:
  schedule:
    # 10分ごとに見に行く。GitHubのタイマーは混む時刻（毎時0分など）に遅れたり飛ばされたりするので、
    # きりのよい分を避けて 3分・13分・23分… にしてある（2026年10月11日、*/10 では6時間で1回しか動かなかった）
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: threads-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: post
        run: python3 post.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      - name: save
        if: always()
        run: |
          git config user.name "threads-post-bot"
          git config user.email "threads-post-bot@users.noreply.github.com"
          git add done.json
          if ! git diff --cached --quiet; then
            git commit -m "記録"
            git pull --rebase
            git push
          fi
